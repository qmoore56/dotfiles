
general {
    gaps_in = 3      # Gaps between windows
    gaps_out = 12     # Gaps between windows and monitor edges
    border_size = 2
    col.active_border = rgba(0eb77cee)
    col.inactive_border = rgba(595959aa)
}

decoration {
    rounding = 7

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 0.9

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1
        
        vibrancy = 0.1696
    }
}
